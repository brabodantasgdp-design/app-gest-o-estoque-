<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>EBD RetailPro - Grafo de Dependências</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0B0B0C; color: #e4e4e7; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  header { background: #121214; border-bottom: 1px solid #27272a; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  h1 { font-size: 14px; font-weight: 800; letter-spacing: -0.5px; }
  h1 span { color: #f59e0b; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
  .badge-root { background: #f59e0b20; color: #f59e0b; border: 1px solid #f59e0b40; }
  .badge-core { background: #3b82f620; color: #3b82f6; border: 1px solid #3b82f640; }
  .badge-leaf { background: #22c55e20; color: #22c55e; border: 1px solid #22c55e40; }
  .badge-dead { background: #ef444420; color: #ef4444; border: 1px solid #ef444440; }
  .legend { display: flex; gap: 12px; margin-left: auto; font-size: 10px; }
  #canvas { width: 100vw; height: calc(100vh - 52px); }
  .tooltip {
    position: fixed; background: #18181b; border: 1px solid #f59e0b60; padding: 8px 12px; border-radius: 8px;
    font-size: 11px; pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 999;
    max-width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  .tooltip .title { font-weight: 800; color: #f59e0b; }
  .tooltip .path { color: #71717a; font-family: monospace; font-size: 10px; }
</style>
</head>
<body>
<header>
  <h1><span>EBD</span> RetailPro &mdash; Grafo de Dependências</h1>
  <span class="badge badge-root">Entry</span>
  <span class="badge badge-core">Core/UI</span>
  <span class="badge badge-leaf">Leaf</span>
  <span class="badge badge-dead">Morto</span>
</header>
<div id="canvas"></div>
<div class="tooltip" id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const nodes = [
  // LAYER 0 - Entry
  { id: "main.tsx",        group: "entry",  label: "main.tsx",        desc: "ReactDOM entry point" },
  { id: "server.ts",       group: "entry",  label: "server.ts",       desc: "Express + API (OCR, Auth, IA, Voice)" },

  // LAYER 1 - App Root
  { id: "App.tsx",         group: "core",   label: "App.tsx",         desc: "Raiz da SPA, routing, estado global" },

  // LAYER 2 - Types & Lib
  { id: "types.ts",        group: "leaf",   label: "types.ts",        desc: "Interfaces TypeScript (User, Product, Insumo, Order...)" },
  { id: "supabase.ts",     group: "leaf",   label: "lib/supabase.ts", desc: "Cliente Supabase" },
  { id: "database.ts",     group: "core",   label: "lib/database.ts", desc: "CRUD services (Supabase + LocalStorage fallback)" },
  { id: "mockData.ts",     group: "leaf",   label: "data/mockData.ts",desc: "Dados mock para dev" },

  // LAYER 3 - Components
  { id: "Header.tsx",      group: "core",   label: "Header.tsx",      desc: "Header + tenant switcher" },
  { id: "Sidebar.tsx",     group: "core",   label: "Sidebar.tsx",     desc: "Navegação lateral" },
  { id: "ErrorBoundary",   group: "core",   label: "ErrorBoundary™",  desc: "Error boundary wrapper" },
  { id: "DashboardView",   group: "core",   label: "DashboardView™",  desc: "Dashboard de métricas" },
  { id: "InvoicesList",    group: "core",   label: "InvoicesListView",desc: "Lista de notas fiscais" },
  { id: "InvoiceDetail",   group: "core",   label: "InvoiceDetail",   desc: "Modal detalhe NF-e" },
  { id: "InsumosModule",   group: "core",   label: "InsumosModule",   desc: "Gestão de insumos" },
  { id: "AddInsumoModal",  group: "core",   label: "AddInsumoModal",  desc: "Modal adicionar insumo" },
  { id: "QuickAddInsumo",  group: "core",   label: "QuickAddInsumo",  desc: "Adição rápida de insumo" },
  { id: "FichaTecnica",    group: "core",   label: "FichaTecnica™",   desc: "Fichas técnicas de produtos" },
  { id: "InvoiceOCR",      group: "core",   label: "InvoiceOCR™",     desc: "OCR de NF-e com Gemini" },
  { id: "ProductsModule",  group: "core",   label: "ProductsModule",  desc: "Catálogo de produtos" },
  { id: "OrdersModule",    group: "core",   label: "OrdersModule",    desc: "Gestão de pedidos" },
  { id: "SuperAdmin",      group: "core",   label: "SuperAdmin",      desc: "Painel super admin" },
  { id: "ReportsView",     group: "core",   label: "ReportsView",     desc: "Relatórios" },
  { id: "SettingsView",    group: "core",   label: "SettingsView",    desc: "Configurações" },
  { id: "LoginForm",       group: "core",   label: "LoginForm",       desc: "Tela de autenticação" },
  { id: "SimpleVoice",     group: "core",   label: "SimpleVoice™",    desc: "Assistente de voz simplificado" },
  { id: "VoiceAssistant",  group: "dead",   label: "VoiceAssistant ⚠", desc: "CÓDIGO MORTO - Não importado no App" },

  // LAYER 4 - ebdAi
  { id: "ebdAi/index",     group: "core",   label: "ebdAi/index.ts",  desc: "Facade principal da IA" },
  { id: "ebdAi/core",      group: "leaf",   label: "ebdAi/core.ts",   desc: "Chat engine + Gemini" },
  { id: "ebdAi/voice",     group: "leaf",   label: "ebdAi/voice.ts",  desc: "Síntese de voz" },
  { id: "ebdAi/alerts",    group: "leaf",   label: "ebdAi/alerts.ts", desc: "Alertas + agendamento" },
  { id: "ebdAi/predict",   group: "leaf",   label: "ebdAi/predictions",desc: "Previsão de estoque" },
  { id: "ebdAi/workflows", group: "leaf",   label: "ebdAi/workflows", desc: "Workflows automáticos" },
  { id: "ebdAi/export",    group: "leaf",   label: "ebdAi/export.ts", desc: "Export CSV/JSON/PDF" },
  { id: "ebdAi/memory",    group: "leaf",   label: "ebdAi/memory.ts", desc: "Memória + preferências" },

  // LAYER 5 - Services (sistema antigo/legado)
  { id: "geminiService",   group: "dead",   label: "geminiService ⚠", desc: "Serviço Gemini (legado, sobreposto pelo ebdAi/core)" },
  { id: "jarvisCore",      group: "dead",   label: "jarvisCore ⚠",    desc: "Core antigo do JARVIS (sobreposto pelo ebdAi)" },
  { id: "jarvisVoice",     group: "dead",   label: "jarvisVoice ⚠",   desc: "Voz antiga JARVIS" },
  { id: "jarvisTools",     group: "dead",   label: "jarvisTools ⚠",   desc: "Tools antigas JARVIS" },
  { id: "advancedTools",   group: "dead",   label: "advancedTools ⚠", desc: "Tools avançadas (legado)" },
  { id: "voiceService",    group: "dead",   label: "voiceService ⚠",  desc: "Serviço de voz (legado, sobreposto pelo ebdAi/voice)" },
  { id: "episodicMemory",  group: "dead",   label: "episodicMemory ⚠",desc: "Memória episódica (legado)" },
  { id: "conversationEng", group: "dead",   label: "conversationEng ⚠",desc: "Engine de conversa (legado)" },

  // LAYER 6 - Hooks
  { id: "useVoiceRecog",   group: "core",   label: "useVoiceRecog.ts", desc: "Hook de reconhecimento de voz" },
];

const links = [
  // Entry -> App
  { source: "main.tsx",        target: "App.tsx" },
  { source: "main.tsx",        target: "ErrorBoundary" },

  // App.tsx -> Components
  { source: "App.tsx",         target: "Header.tsx" },
  { source: "App.tsx",         target: "Sidebar.tsx" },
  { source: "App.tsx",         target: "ErrorBoundary" },
  { source: "App.tsx",         target: "DashboardView" },
  { source: "App.tsx",         target: "InvoicesList" },
  { source: "App.tsx",         target: "InsumosModule" },
  { source: "App.tsx",         target: "FichaTecnica" },
  { source: "App.tsx",         target: "InvoiceOCR" },
  { source: "App.tsx",         target: "ProductsModule" },
  { source: "App.tsx",         target: "OrdersModule" },
  { source: "App.tsx",         target: "SuperAdmin" },
  { source: "App.tsx",         target: "ReportsView" },
  { source: "App.tsx",         target: "SettingsView" },
  { source: "App.tsx",         target: "LoginForm" },
  { source: "App.tsx",         target: "SimpleVoice" },
  { source: "App.tsx",         target: "types.ts" },
  { source: "App.tsx",         target: "database.ts" },

  // Components -> types + database
  { source: "Header.tsx",      target: "types.ts" },
  { source: "Sidebar.tsx",     target: "types.ts" },
  { source: "InsumosModule",   target: "types.ts" },
  { source: "InsumosModule",   target: "database.ts" },
  { source: "InsumosModule",   target: "AddInsumoModal" },
  { source: "AddInsumoModal",  target: "types.ts" },
  { source: "QuickAddInsumo",  target: "types.ts" },
  { source: "QuickAddInsumo",  target: "database.ts" },
  { source: "FichaTecnica",    target: "types.ts" },
  { source: "FichaTecnica",    target: "database.ts" },
  { source: "InvoiceOCR",      target: "types.ts" },
  { source: "InvoiceOCR",      target: "database.ts" },
  { source: "InvoiceOCR",      target: "geminiService" },
  { source: "ProductsModule",  target: "types.ts" },
  { source: "ProductsModule",  target: "database.ts" },
  { source: "OrdersModule",    target: "types.ts" },
  { source: "OrdersModule",    target: "database.ts" },
  { source: "SuperAdmin",      target: "types.ts" },
  { source: "SuperAdmin",      target: "database.ts" },
  { source: "ReportsView",     target: "types.ts" },
  { source: "SettingsView",    target: "types.ts" },
  { source: "LoginForm",       target: "types.ts" },
  { source: "LoginForm",       target: "database.ts" },
  { source: "InvoicesList",    target: "types.ts" },
  { source: "InvoicesList",    target: "InvoiceDetail" },
  { source: "InvoiceDetail",   target: "types.ts" },
  { source: "DashboardView",   target: "types.ts" },

  // database -> supabase + types
  { source: "database.ts",     target: "supabase.ts" },
  { source: "database.ts",     target: "types.ts" },

  // Voice code (mixed)
  { source: "SimpleVoice",     target: "useVoiceRecog" },

  // Dead voice assistant -> services (legacy)
  { source: "VoiceAssistant",  target: "geminiService" },
  { source: "VoiceAssistant",  target: "jarvisCore" },
  { source: "VoiceAssistant",  target: "jarvisVoice" },
  { source: "VoiceAssistant",  target: "jarvisTools" },
  { source: "VoiceAssistant",  target: "advancedTools" },
  { source: "VoiceAssistant",  target: "episodicMemory" },
  { source: "VoiceAssistant",  target: "useVoiceRecog" },
  { source: "VoiceAssistant",  target: "types.ts" },

  // ebdAi internal
  { source: "ebdAi/index",     target: "ebdAi/core" },
  { source: "ebdAi/index",     target: "ebdAi/voice" },
  { source: "ebdAi/index",     target: "ebdAi/alerts" },
  { source: "ebdAi/index",     target: "ebdAi/predict" },
  { source: "ebdAi/index",     target: "ebdAi/workflows" },
  { source: "ebdAi/index",     target: "ebdAi/export" },
  { source: "ebdAi/index",     target: "ebdAi/memory" },
  { source: "ebdAi/core",      target: "ebdAi/index" },
  { source: "ebdAi/voice",     target: "ebdAi/index" },

  // Legacy service dependencies
  { source: "geminiService",   target: "jarvisCore" },
  { source: "jarvisTools",     target: "jarvisCore" },
  { source: "jarvisTools",     target: "jarvisVoice" },
  { source: "jarvisTools",     target: "database.ts" },
  { source: "jarvisTools",     target: "types.ts" },
  { source: "jarvisCore",      target: "types.ts" },
  { source: "advancedTools",   target: "types.ts" },
  { source: "voiceService",    target: "types.ts" },
  { source: "voiceService",    target: "database.ts" },
];

// Colors
const colors = {
  entry:  { fill: "#f59e0b", stroke: "#f59e0b", text: "#fff" },
  core:   { fill: "#3b82f6", stroke: "#3b82f6", text: "#fff" },
  leaf:   { fill: "#22c55e", stroke: "#22c55e", text: "#fff" },
  dead:   { fill: "#ef4444", stroke: "#ef4444", text: "#fff" },
};

const W = document.getElementById("canvas").clientWidth;
const H = document.getElementById("canvas").clientHeight;

const svg = d3.select("#canvas").append("svg")
  .attr("width", W).attr("height", H);

const g = svg.append("g");

const zoom = d3.zoom().scaleExtent([0.15, 3]).on("zoom", (e) => g.attr("transform", e.transform));
svg.call(zoom);
svg.call(zoom.transform, d3.zoomIdentity.translate(W/2 - 100, H/2 - 200).scale(0.7));

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(100))
  .force("charge", d3.forceManyBody().strength(-400))
  .force("center", d3.forceCenter(0, 0))
  .force("x", d3.forceX().x(d => {
    if (d.group === "entry") return -400;
    if (d.group === "dead") return 450;
    return 0;
  }))
  .force("y", d3.forceY().y(d => {
    if (d.group === "leaf" || d.id.startsWith("ebdAi/")) return -250;
    if (d.group === "dead") return 200;
    return 0;
  }));

const link = g.append("g").selectAll("line")
  .data(links).join("line")
  .attr("stroke", d => {
    const t = nodes.find(n => n.id === d.target.id);
    return t?.group === "dead" ? "#ef444440" : "#3b82f640";
  })
  .attr("stroke-width", 1.5)
  .attr("marker-end", d => {
    const t = nodes.find(n => n.id === d.target.id);
    return t?.group === "dead" ? "url(#arrow-dead)" : "url(#arrow-core)";
  });

svg.append("defs").html(`
  <marker id="arrow-core" viewBox="0 0 10 10" refX="18" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f680"/>
  </marker>
  <marker id="arrow-dead" viewBox="0 0 10 10" refX="18" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef444480"/>
  </marker>
`);

const node = g.append("g").selectAll("g")
  .data(nodes).join("g")
  .call(d3.drag()
    .on("start", (e,d) => { if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e,d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e,d) => { if(!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

node.append("circle")
  .attr("r", d => d.group === "entry" ? 14 : 8)
  .attr("fill", d => colors[d.group]?.fill)
  .attr("stroke", d => colors[d.group]?.stroke)
  .attr("stroke-width", 2);

node.append("text")
  .text(d => d.label)
  .attr("x", 15).attr("y", 4)
  .attr("fill", d => colors[d.group]?.text)
  .attr("font-size", "10px").attr("font-weight", "700")
  .attr("font-family", "monospace");

node.on("mouseenter", (e,d) => {
  d3.select("#tooltip")
    .style("opacity", 1)
    .html(`<div class="title">${d.label}</div><div class="path">${d.desc}</div>`);
}).on("mousemove", (e) => {
  d3.select("#tooltip").style("left", (e.pageX+12)+"px").style("top", (e.pageY-12)+"px");
}).on("mouseleave", () => {
  d3.select("#tooltip").style("opacity", 0);
});

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
</body>
</html>
